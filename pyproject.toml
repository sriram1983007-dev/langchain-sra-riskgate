[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-sra-riskgate"
version = "0.3.1"
description = "LangChain middleware that checks an AI agent's stablecoin payments before they are sent"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sriram Ramakrishnan" }]
dependencies = ["langchain-core>=0.3.0,<2", "sra-riskgate>=0.7.1"]
keywords = ["langchain", "middleware", "agentkit", "stablecoin", "usdc", "x402", "payments", "guardrails", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/sriram1983007-dev/langchain-sra-riskgate"
Repository = "https://github.com/sriram1983007-dev/langchain-sra-riskgate"
Model = "https://huggingface.co/sriram1983007/SRA-RiskGate-4B"
SDK = "https://github.com/sriram1983007-dev/sra-riskgate"
Changelog = "https://github.com/sriram1983007-dev/langchain-sra-riskgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
middleware = ["langchain>=1.0,<2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
